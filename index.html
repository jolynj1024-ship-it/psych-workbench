<script>
  // 捕获浏览器安装提示，供「设置」页按钮触发
  (function () {
    window.__deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__deferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pw-installable'));
    });
    window.addEventListener('appinstalled', function () {
      window.__deferredPrompt = null;
      window.dispatchEvent(new CustomEvent('pw-installed'));
    });
    window.promptInstall = async function () {
      var p = window.__deferredPrompt;
      if (!p) return false;
      p.prompt();
      var r = { outcome: 'dismissed' };
      try { r = await p.userChoice; } catch (e) {}
      window.__deferredPrompt = null;
      return r.outcome === 'accepted';
    };
  })();
  // 注册 Service Worker（离线 / 秒开）
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
